<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darknet AI // UNRESTRICTED CORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Using CSS variables for dynamic theming
              primary: 'var(--color-primary)',
              secondary: 'var(--color-secondary)',
              bg: 'var(--color-bg)',
              surface: 'var(--color-surface)',
              text: 'var(--color-text)',
              accent: 'var(--color-accent)',
              danger: '#ff2a6d',
              success: '#05ffa1',
            },
            fontFamily: {
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
              display: ['Orbitron', 'sans-serif'], // Assumed generic if not loaded
            },
            animation: {
              'spin-slow': 'spin 3s linear infinite',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'glitch': 'glitch 1s linear infinite',
              'grid-flow': 'gridMove 20s linear infinite',
            },
            keyframes: {
              glitch: {
                '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },
                '62%': { transform: 'translate(0,0) skew(5deg)' },
              },
              gridMove: {
                '0%': { transform: 'translateY(0)' },
                '100%': { transform: 'translateY(50px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-primary: #00f2ff;
        --color-secondary: #0f172a;
        --color-bg: #030712;
        --color-surface: #111827;
        --color-text: #e2e8f0;
        --color-accent: #00f2ff;
      }

      [data-theme='matrix'] {
        --color-primary: #00ff41;
        --color-secondary: #0d0208;
        --color-bg: #000000;
        --color-surface: #0a0a0a;
        --color-text: #008f11;
        --color-accent: #00ff41;
      }

      [data-theme='synth'] {
        --color-primary: #d946ef;
        --color-secondary: #2e1065;
        --color-bg: #1a0b2e;
        --color-surface: #2e1065;
        --color-text: #e9d5ff;
        --color-accent: #fcd34d;
      }

      body {
        background-color: var(--color-bg);
        color: var(--color-text);
        transition: background-color 0.5s ease, color 0.5s ease;
        overflow: hidden; /* Prevent body scroll, handled by app */
      }
      
      /* Scanline Effect */
      .scanlines {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.2) 50%,
          rgba(0,0,0,0.2)
        );
        background-size: 100% 4px;
        position: fixed;
        pointer-events: none;
        top: 0; right: 0; bottom: 0; left: 0;
        z-index: 9999;
        opacity: 0.15;
      }

      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.1);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: var(--color-primary);
        border-radius: 3px;
        opacity: 0.5;
      }
      
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^11.0.8"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <div class="scanlines"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
